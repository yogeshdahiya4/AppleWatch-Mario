name: PixelHop
options:
  bundleIdPrefix: com.yogeshdahiya
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""    # filled in by user via Signing & Capabilities tab
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
targets:
  PixelHop Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PixelHop
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshdahiya.pixelhop.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: PixelHop
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKBackgroundModes: ""
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PixelHop. Code MIT, art CC0."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
